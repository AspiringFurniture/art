<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lawrence's Art Portfolio</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- jQuery (required) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- JustifiedGallery plugin -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/justifiedGallery@3.8.1/dist/css/justifiedGallery.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/justifiedGallery@3.8.1/dist/js/jquery.justifiedGallery.min.js"></script>

    <!-- Lightbox plugin -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
</head>
<body id="Top">
    <header>
        <div class="site-title">AspiringFurniture</div>
        <div class="sub-title">One day I'll become a drawer</div>
    </header>
    <div class="main-nav">
        <a href="#Top">Introduction</a>
        <a href="#Illustrations">Illustrations</a>
        <a href="#Table">Table</a>
    </div>
    <section>
        <h1>Introduction</h1>
        <p>Hi, my name is Lawrence and I make dumb name choices. I also make illustrations. I plan on selling prints of my illustrations in 2 sizes: 11x17 and 5.5x8.5.</p>
    </section>
    <section id="Illustrations">

        <h1>Illustrations</h1>
        <div id="illustrationGallery"></div>
    </section>

    <section id="Table">
        <h1>Artist Alley Table</h1>
        <!--<p>Below are mockups of what my table would look like.</p>-->

        <div class="table-images">
            <img src="artworks/misc/table1.jpg">
            <img src="artworks/misc/table2.jpg">
        </div>

    </section>

    <footer>
    </footer>

    <script>
        fetch('artworks/artistalley/images.json')
            .then(response => response.json())
            .then(images => {
                const gallery = document.getElementById('illustrationGallery');
                const folder = 'artworks/artistalley/';

                images.forEach(filename => {
                    const path = folder + filename;
                    const title = filename.replace(/\.[^/.]+$/, '');

                    gallery.insertAdjacentHTML('beforeend', `
                        <a href="${path}" class="glightbox">
                            <img src="${path}" alt="${title}" />
                        </a>`);
                });

                $('#illustrationGallery').justifiedGallery({
                    rowHeight: 550,
                    margins: 10,
                    lastRow: 'nojustify',
                    captions: false
                });

                GLightbox({ selector: '.glightbox' });
            })
            .catch(error => console.error('Could not load gallery images:', error));

        const sections = document.querySelectorAll('section:not(:first-of-type)');
        const navLinks = document.querySelectorAll('.main-nav a');
        const offset = 4 * parseFloat(getComputedStyle(document.documentElement).fontSize);

        function onScroll() {
            let current = 'Top';

            sections.forEach(section => {
                if (section.getBoundingClientRect().top <= offset) {
                    current = section.id;
                }
            });

            navLinks.forEach(a => {
                a.classList.remove('active');
                if (a.getAttribute('href') === '#' + current) {
                    a.classList.add('active');
                }
            });
        }

        window.addEventListener('scroll', onScroll);
        onScroll();
    </script>
</body>
</html>
